[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-regexlab"
dynamic = ["version"]
description = "Explain, test, generate, compare, and debug regular expressions from the command line."
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.11"

authors = [
  { name = "The Lupaxa Project" }
]

keywords = ["regex", "regular-expressions", "cli", "testing", "textual"]

dependencies = [
  "rich>=13.0",
  "textual>=0.80",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lupaxa-developers-toolbox/regexlab"
Documentation = "https://github.com/lupaxa-developers-toolbox/regexlab"
Repository = "https://github.com/lupaxa-developers-toolbox/regexlab"
Issues = "https://github.com/lupaxa-developers-toolbox/regexlab/issues"

[project.scripts]
regex-lab = "lupaxa.regexlab.cli:main"
regexlab = "lupaxa.regexlab.cli:main"

[project.optional-dependencies]
regex = [
  "regex>=2024.0",
]
pcre2 = [
  "python-pcre2>=0.4",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "hatch>=1.12.0",
  "bump-my-version>=1.2.0",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.hatch.version]
path = "src/lupaxa/regexlab/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "README.md",
  "LICENCE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lupaxa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]
